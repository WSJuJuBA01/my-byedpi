name: Clean Repo (Manual)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Напиши DELETE для подтверждения'
        required: true

permissions:
  contents: write

jobs:
  clean:
    if: github.event.inputs.confirm == 'DELETE'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Delete everything except .github, README.md, LICENSE
        run: |
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name 'README.md' \
            ! -name 'LICENSE' \
            -exec rm -rf {} +

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to delete"
            exit 0
          fi
          git commit -m "Clean repo: remove old code"
          git push
